[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-skill-store"
version = "0.1.0"
description = "A user-level store of Claude Code skills, linked into projects on demand (junctions on Windows, symlinks elsewhere). Unlinking never deletes."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
build = ["skill-seekers==3.1.3"]
test = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
skill-store = "skillstore.cli:main"

[tool.setuptools]
packages = ["skillstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
