# Manual-only CI (opt-in). Nothing here runs automatically: there are no push or
# pull_request triggers, and this workflow is never a required check for merging.
# Starting it (Actions tab -> CI -> "Run workflow", or `gh workflow run ci.yml`) uses the
# account's free included GitHub Actions minutes; Windows runners count 2x per minute.
# The normal way to test is locally: scripts/test-local.ps1 (Windows, optionally -Wsl)
# or scripts/test-local.sh (Linux/WSL). See "Running tests" in the README.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -v
      - name: CLI smoke test (temp store and project)
        shell: bash
        env:
          SKILL_STORE_HOME: ${{ runner.temp }}/store
        run: |
          set -eu
          proj="$RUNNER_TEMP/proj"
          mkdir -p "$proj"
          skill-store --version
          skill-store init
          skill-store init-project --project "$proj"
          skill-store sync --quiet --project "$proj"
          skill-store unlink --all --project "$proj"
          skill-store status --project "$proj"
          echo '{"tool_name":"Skill","tool_input":{"skill":"x"}}' | skill-store log-usage
          echo 'garbage' | skill-store log-usage
          sh bin/skill-store.sh --version
      - name: Wrapper smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./bin/skill-store.ps1 --version
          cmd /c "bin\skill-store.cmd --version"
